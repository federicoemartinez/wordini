<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="bg" cx=".5" cy="0" r="1">
      <stop offset="0" stop-color="#2a1450"/>
      <stop offset=".75" stop-color="#0b0b14"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- A board tile with the trail spelling a W through its letters -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <rect x="3" y="3" width="58" height="58" rx="11" fill="none" stroke="#00e5ff" stroke-width="3" filter="url(#glow)"/>
  <polyline points="14,19 22.5,45 32,27 41.5,45 50,19" fill="none" stroke="#ff2bd6" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <polyline points="14,19 22.5,45 32,27 41.5,45 50,19" fill="none" stroke="#ffc4f3" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
