<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0b14">
  <!-- Title and description are rewritten in the player's language by main.js; these are for crawlers that don't run JS -->
  <title>Wordini · word game · juego de palabras · jeu de mots</title>
  <meta name="description" content="Free word game: drag across touching letters to spell words and beat endless levels. Same board for everyone, in English, Spanish and French.">
  <link rel="alternate" hreflang="es" href="https://federicoemartinez.github.io/wordini/?l=es">
  <link rel="alternate" hreflang="en" href="https://federicoemartinez.github.io/wordini/?l=en">
  <link rel="alternate" hreflang="fr" href="https://federicoemartinez.github.io/wordini/?l=fr">
  <link rel="alternate" hreflang="x-default" href="https://federicoemartinez.github.io/wordini/">
  <!-- Link preview (WhatsApp, Telegram, X…) -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Wordini">
  <meta property="og:title" content="Wordini">
  <meta property="og:description" content="Juego de palabras · Word game · Jeu de mots">
  <meta property="og:url" content="https://federicoemartinez.github.io/wordini/">
  <meta property="og:image" content="https://federicoemartinez.github.io/wordini/og.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-maskable.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&display=swap">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <header>
    <h1>WORDINI</h1>
    <select id="lang" data-label="language"></select>
    <button id="btn-help" class="icon" data-label="help">?</button>
    <button id="btn-mute" class="icon" data-label="mute">🔊</button>
  </header>

  <main>
    <div id="hud">
      <div id="lvl"><span id="level"></span><span id="time"></span></div>
      <div id="bar"><div id="fill"></div><span id="score"></span></div>
      <span id="common"></span>
    </div>
    <p id="word" aria-live="polite"></p>
    <div id="board"></div>
    <div id="hint-row">
      <button id="btn-hint" class="icon" data-label="hint">💡</button>
      <p id="hint" aria-live="polite"></p>
      <p id="meaning" aria-live="polite"></p>
    </div>
    <button id="btn-next" data-t="nextLevel" hidden></button>
    <details id="found-box">
      <summary id="found-title"></summary>
      <div id="found"></div>
    </details>
  </main>

  <footer>
    <button id="btn-install" data-t="install" hidden></button>
    <a class="coffee" href="https://cafecito.app/federicoemartinez" target="_blank" rel="noopener" data-t="coffee"></a>
    <a href="https://github.com/federicoemartinez/wordini/blob/master/CREDITS.md" target="_blank" rel="noopener" data-t="credits"></a>
  </footer>

  <dialog id="dlg-help">
    <h2 data-t="helpTitle"></h2>
    <ol>
      <li data-t="help1"></li>
      <li data-t="help2"></li>
      <li data-t="help3"></li>
    </ol>
    <p class="example" data-t="example"></p>
    <form method="dialog"><button data-t="close"></button></form>
  </dialog>

  <dialog id="dlg-clear">
    <h2 data-t="clearedTitle"></h2>
    <p id="clear-score"></p>
    <div class="row">
      <button id="btn-share" data-t="share"></button>
      <button id="btn-missed" data-t="missedBtn"></button>
    </div>
    <p id="missed" hidden></p>
    <a class="coffee" href="https://cafecito.app/federicoemartinez" target="_blank" rel="noopener" data-t="coffeeAsk"></a>
    <form method="dialog">
      <button data-t="keepPlaying"></button>
      <button id="btn-next-dlg" data-t="nextLevel"></button>
    </form>
  </dialog>
</body>
</html>
