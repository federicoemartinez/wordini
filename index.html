<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0b14">
  <title>Wordini</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&display=swap">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <header>
    <h1>WORDINI</h1>
    <select id="lang" data-label="language"></select>
    <button id="btn-help" class="icon" data-label="help">?</button>
    <button id="btn-stats" class="icon" data-label="stats">📊</button>
    <button id="btn-mute" class="icon" data-label="mute">🔊</button>
  </header>

  <main>
    <div id="lock"></div>
    <button id="btn-open"></button>
    <p id="message" aria-live="polite"></p>
    <ol id="history"></ol>
  </main>

  <footer><a href="CREDITS.md" data-t="credits"></a></footer>

  <dialog id="dlg-help">
    <h2 data-t="helpTitle"></h2>
    <ol>
      <li data-t="help1"></li>
      <li data-t="help2"></li>
      <li data-t="help3"></li>
    </ol>
    <p class="example" data-t="example"></p>
    <form method="dialog"><button data-t="close"></button></form>
  </dialog>

  <dialog id="dlg-stats">
    <h2 data-t="statsTitle"></h2>
    <div id="stats"></div>
    <div id="dist"></div>
    <p id="next" data-t="next"></p>
    <button id="btn-share" data-t="share"></button>
    <form method="dialog"><button data-t="close"></button></form>
  </dialog>
</body>
</html>
