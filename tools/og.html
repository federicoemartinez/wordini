<!doctype html>
<!-- Source of og.jpg, the link preview image. How to regenerate it: see README. -->
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&display=block">
<style>
  body {
    margin: 0; width: 1200px; height: 630px; overflow: hidden;
    display: flex; align-items: center; justify-content: center; gap: 70px;
    background: radial-gradient(ellipse at top, #2a1450, #0b0b14 70%);
    color: #ecebff; font-family: 'Bungee', sans-serif;
  }
  #board { position: relative; display: grid; grid-template-columns: repeat(4, 88px); gap: 14px; }
  .tile {
    height: 88px; display: grid; place-items: center; font-size: 40px;
    border: 3px solid #00e5ff; border-radius: 16px; background: #15152c;
    box-shadow: 0 0 10px #00e5ff, inset 0 0 14px #00e5ff33; text-shadow: 0 0 8px #00e5ff;
  }
  .on { border-color: #ff2bd6; box-shadow: 0 0 14px #ff2bd6, 0 0 30px #ff2bd6; }
  svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  polyline { fill: none; stroke: #ff2bd6; stroke-width: 16; stroke-linecap: round; stroke-linejoin: round; opacity: .55; filter: drop-shadow(0 0 8px #ff2bd6); }
  h1 { margin: 0; font-size: 104px; font-weight: normal; color: #ff2bd6; text-shadow: 0 0 6px #ff2bd6, 0 0 20px #ff2bd6, 0 0 44px #ff2bd6; }
  p { margin: 18px 0 0; font-size: 30px; color: #00e5ff; text-shadow: 0 0 10px #00e5ff; }
  p + p { margin-top: 10px; color: #9a9ac0; text-shadow: none; }
</style>
<div id="board"></div>
<div>
  <h1>WORDINI</h1>
  <p>Juego de palabras</p>
  <p>Word game · Jeu de mots</p>
</div>
<script>
  // 4x4 board where W-O-R-D-I-N-I is a path of neighboring tiles
  const letters = 'WOSAEDRTINLMICUP', path = [0, 1, 6, 5, 8, 9, 12];
  const board = document.getElementById('board');
  board.innerHTML = [...letters].map((l, i) => `<div class="tile${path.includes(i) ? ' on' : ''}">${l}</div>`).join('');
  const at = i => `${(i % 4) * 102 + 44},${Math.floor(i / 4) * 102 + 44}`;
  board.insertAdjacentHTML('beforeend', `<svg><polyline points="${path.map(at).join(' ')}"/></svg>`);
</script>
